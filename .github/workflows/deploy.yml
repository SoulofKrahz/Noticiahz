# Prueba la app y, si todo va bien, publica la carpeta site/ en Cloudflare Pages (rama main).
# La prueba vive en test.yml (la misma que se ejecuta sola en pulido).
# Secretos en GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (token con permiso Account → Cloudflare Pages → Edit)
#   CLOUDFLARE_ACCOUNT_ID (ID de tu cuenta de Cloudflare)
# Variable (pestaña Variables): CF_PROJECT = nombre del proyecto de Pages.
name: Publicar en Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:
jobs:
  test:
    name: Prueba
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  deploy:
    name: Publicar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Generar version.txt (para el aviso de versión nueva)
        run: grep -o "const VER='[^']*'" site/index.html | cut -d"'" -f2 > site/version.txt && cat site/version.txt
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=main --commit-dirty=true
